name: iOS Cloud Build & Archive

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'release_ipa'
        type: choice
        options:
          - release_ipa
          - unsigned_verification

jobs:
  build-ios:
    name: Build iOS (${{ inputs.build_mode }})
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version
          swift --version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Prepare iOS SPM & Build Directories
        run: |
          mkdir -p build/ios/SourcePackages
          mkdir -p ios/Flutter/ephemeral/Packages

      - name: Install Flutter Dependencies
        run: |
          mkdir -p build/ios/SourcePackages
          flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: Install CocoaPods (if Podfile exists)
        run: |
          if [ -f "ios/Podfile" ]; then
            cd ios
            pod install --repo-update
          else
            echo "Project uses Swift Package Manager (no Podfile present). Skipping CocoaPods."
          fi

      - name: Verify & Build Unsigned iOS (.app)
        if: ${{ inputs.build_mode == 'unsigned_verification' }}
        run: |
          flutter build ios --release --no-codesign

      - name: Setup Apple Signing & Build IPA
        if: ${{ inputs.build_mode == 'release_ipa' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'eyoonak_temp_keychain' }}
        run: |
          # 1. Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # 2. Import Distribution Certificate (Auto-adapts to legacy & modern PKCS#12)
          CERT_PATH=$RUNNER_TEMP/apple_cert.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $CERT_PATH

          if ! security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH; then
            echo "Direct PKCS#12 import failed (PBES2 mismatch). Converting to macOS legacy PKCS#12..."
            openssl pkcs12 -in $CERT_PATH -passin pass:"$APPLE_CERTIFICATE_PASSWORD" -nodes -out $RUNNER_TEMP/cert_temp.pem
            openssl pkcs12 -export -legacy -in $RUNNER_TEMP/cert_temp.pem -passout pass:"$APPLE_CERTIFICATE_PASSWORD" -out $RUNNER_TEMP/apple_cert_legacy.p12 2>/dev/null || \
            openssl pkcs12 -export -in $RUNNER_TEMP/cert_temp.pem -passout pass:"$APPLE_CERTIFICATE_PASSWORD" -out $RUNNER_TEMP/apple_cert_legacy.p12
            security import $RUNNER_TEMP/apple_cert_legacy.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            rm -f $RUNNER_TEMP/cert_temp.pem $RUNNER_TEMP/apple_cert_legacy.p12
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true

          # 3. Import Provisioning Profile
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_DIR/Eyoonak_App_Store.mobileprovision"
          PROFILE_UUID=$(grep -a -A 1 '<key>UUID</key>' "$PP_DIR/Eyoonak_App_Store.mobileprovision" | grep -v '<key>' | sed -e 's/<[^>]*>//g' | tr -d ' \t\n\r')
          if [ -n "$PROFILE_UUID" ]; then
            cp "$PP_DIR/Eyoonak_App_Store.mobileprovision" "$PP_DIR/$PROFILE_UUID.mobileprovision"
            echo "Installed Provisioning Profile UUID: $PROFILE_UUID"
          fi

          # 4. Build Signed IPA
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload iOS App Artifact
        if: ${{ inputs.build_mode == 'unsigned_verification' }}
        uses: actions/upload-artifact@v4
        with:
          name: Eyoonak-iOS-Unsigned-Release
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: warn

      - name: Upload Signed IPA Artifact
        if: ${{ inputs.build_mode == 'release_ipa' }}
        uses: actions/upload-artifact@v4
        with:
          name: Eyoonak-iOS-Signed-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
