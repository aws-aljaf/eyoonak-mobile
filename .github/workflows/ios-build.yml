name: iOS Cloud Build & Archive

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'release_ipa'
        type: choice
        options:
          - release_ipa
          - unsigned_verification

jobs:
  build-ios:
    name: Build iOS (${{ inputs.build_mode }})
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        run: |
          flutter pub get || (rm -f pubspec.lock && flutter pub get)

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: Install CocoaPods
        run: |
          cd ios
          pod repo update
          pod install --repo-update

      - name: Verify & Build Unsigned iOS (.app)
        if: ${{ inputs.build_mode == 'unsigned_verification' }}
        run: |
          flutter build ios --release --no-codesign

      - name: Setup Apple Signing & Build IPA
        if: ${{ inputs.build_mode == 'release_ipa' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'eyoonak_temp_keychain' }}
        run: |
          # 1. Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # 2. Import Distribution Certificate
          CERT_PATH=$RUNNER_TEMP/apple_cert.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $CERT_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 3. Import Provisioning Profile
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_DIR/eyoonak.mobileprovision"

          # 4. Build Signed IPA
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload iOS App Artifact
        if: ${{ inputs.build_mode == 'unsigned_verification' }}
        uses: actions/upload-artifact@v4
        with:
          name: Eyoonak-iOS-Unsigned-Release
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: warn

      - name: Upload Signed IPA Artifact
        if: ${{ inputs.build_mode == 'release_ipa' }}
        uses: actions/upload-artifact@v4
        with:
          name: Eyoonak-iOS-Signed-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
