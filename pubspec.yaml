name: fleet_saas_driver
description: >
  Driver app for the fleet/trips management platform â€” Phase 4
  (documentation/06-execution-plan.md). Talks to the real API v1 backend
  only; no mock/fake data anywhere (section 84's platform-wide rule).
publish_to: 'none'
version: 0.2.17+20261107

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (feature-based + Riverpod per
  # documentation/05-folder-structure.md).
  flutter_riverpod: ^2.4.0

  # Networking â€” every screen talks to the real /api/v1 backend built in
  # Phases 1-3, never a mock client.
  dio: ^5.3.0

  # Navigation.
  go_router: ^13.0.0

  # Sanctum token + device_uuid persisted in the platform keystore/keychain
  # â€” "Remember Device" (module 25) must survive app restarts without
  # storing the token in plain SharedPreferences.
  flutter_secure_storage: ^9.0.0

  # Offline Queue (module 27): SQLite via Drift, per the folder structure
  # doc's explicit "SQLite/Drift" instruction.
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.0
  path: ^1.9.0

  connectivity_plus: ^5.0.0
  geolocator: ^11.0.0
  uuid: ^4.0.0

  # Family live map (mobile follow-up PR): flutter_map is a pure-Dart map
  # widget backed by OpenStreetMap raster tiles â€” no API key or billing
  # account needed, unlike google_maps_flutter. latlong2 is its required
  # coordinate type. First new mobile dependency since the app's Phase-4
  # baseline, so this PR is deliberately scoped to just the map screen
  # (no safe-zone editing, no QR pairing) to isolate the CI risk of a
  # dependency resolution that can't be verified locally (no pub.dev
  # access in this sandbox â€” see mobile/README.md).
  flutter_map: ^7.0.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  latlong2: ^0.9.1

  # POD capture (module 22 / section 15): signature pad + camera photos.
  signature: ^5.4.0
  image_picker: ^1.0.0

  # Every signed download URL in this app (driver documents PR #51, accident
  # photos/police reports, admin report exports) is fetched through the
  # app's own authenticated Dio client (ApiClient.download()/downloadBytes())
  # and handed to the OS via this package's share sheet, never opened
  # directly in an external browser â€” `GET /files/{uuid}` sits behind BOTH
  # `auth:sanctum` and a `signed` URL (verified directly against
  # routes/api_v1.php/SecureFileController.php), so a plain external-browser
  # open carries no Authorization header and 401s. `url_launcher` was used
  # for this originally (PR #51) on the mistaken assumption that the link
  # needed no auth header â€” removed once every call site was fixed to go
  # through this package instead (see claude/admin-unification-plan.md's
  # deferred item 11). No in-app PDF renderer is built either â€” every
  # document type (PDF, JPG, PNG, WEBP per SecureFileService's own
  # allow-list) already has a system-level viewer once shared to it, so
  # building one in Flutter would only duplicate that.
  share_plus: ^7.2.1

  video_player: ^2.9.2
  record: ^6.2.1
  just_audio: ^0.10.6
  adhan_dart: ^2.0.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  cupertino_icons: ^1.0.6
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/eyoonak-logo.png
    - assets/brand/eyoonak-intro.mp4
    - assets/audio/success.wav

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
